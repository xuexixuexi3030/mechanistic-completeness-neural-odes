device: cuda
experiment_name: mc_node_gene_noise01
model:
  activation: tanh
  correction_scale: 0.1
  hidden_layers: 4
  hidden_units: 50
  init_method: glorot_normal
  mode: mode_a
  mode_a_constrain_unknown: true
  mode_a_normalize_inputs: true
  mode_a_state_scales:
  - 20.0
  - 30.0
  - 20.0
  mode_a_use_correction: true
  mode_b_neighborhood_samples: 0
  mode_b_neighborhood_scale: 0.0
  mode_b_normalize_inputs: false
  mode_b_output_scales: []
  mode_b_state_scales: []
  mode_c_bound_correction: true
  mode_c_use_correction: true
  mode_c_use_physics: true
  node_hidden_layers: 3
  node_hidden_units: 24
  node_normalize_inputs: false
  node_output_scales: []
  node_state_scales: []
  ode_atol: 1.0e-06
  ode_rtol: 0.0001
  ode_solver: rk4
  ode_step_size: 1.0
  pinn_output_transform: ''
  pinn_state_scales: []
  positive_output: true
  use_adjoint: false
output_dir: results
system:
  data_path: ''
  data_source: synthetic
  initial_conditions: []
  name: gene_regulatory
  noise_mode: relative_state_std
  noise_std: 0.01
  num_test_points: 100
  num_train_points: 10
  param_init: {}
  preserve_initial_observation: true
  split_strategy: uniform
  state_columns: []
  t_span:
  - 0.0
  - 100.0
  time_column: time
  true_params: {}
training:
  adam_amsgrad: false
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_decay_start: 12000
  adam_epochs: 25000
  adam_eps: 1.0e-08
  adam_final_lr: 1.0e-06
  adam_lr: 0.0001
  alternating_network_steps: 1
  alternating_physics_steps: 2
  alternating_update_start: 16500
  balancing_strategy: fixed
  checkpoint_every: 2500
  component_loss: true
  data_component_max_weight: 0.0
  data_component_weights: []
  data_normalization_floor: 1.0
  early_stopping_min_relative_improvement: 0.0
  early_stopping_patience: 0
  early_stopping_start_epoch: 0
  ema_decay: 0.997
  ema_max_loss_ratio: 1.02
  ema_start_epoch: 17000
  ema_use_for_final: true
  gradient_clip_norm: 2.0
  gradnorm_alpha: 1.5
  init_checkpoint: ''
  lambda_correction: 5.0e-07
  lambda_data: 1.0
  lambda_gamma: 0.0
  lambda_ic: 10.0
  lambda_physics: 1.0
  lambda_physics_data: 0.0
  lambda_reg: 0.0
  lbfgs_epochs: 0
  lbfgs_lr: 1.0
  lbfgs_max_iter: 5
  log_every: 10
  loss_backtrack_end_epoch: 0
  loss_backtrack_factor: 0.5
  loss_backtrack_max_steps: 0
  loss_backtrack_rejection_lr_factor: 0.25
  loss_backtrack_start_epoch: 0
  loss_backtrack_trigger_ratio: 0.0
  loss_type: normalized_mse
  lr_stage_transition_epochs: 0
  lr_stages: []
  max_network_update_norm: 0.0
  max_physics_update_norm: 0.0
  normalize_physics_loss: true
  num_collocation: 200
  ode_window_epochs: 0
  ode_window_points: 0
  ode_window_strategy: rotating
  ode_windows_per_epoch: 1
  parameter_refine_network_lr_factor: 0.1
  parameter_refine_physics_lr_factor: 2.0
  parameter_refine_start: 15000
  phys_lr: 0.0001
  phys_lr_overrides:
    k_off: 0.0002
  physics_data_derivative_method: midpoint
  physics_ramp_epochs: 0
  physics_ramp_power: 1.0
  physics_ramp_schedule: linear
  physics_warmup_epochs: 0
  pinn_adaptive_collocation: false
  pinn_adaptive_fraction: 0.0
  pinn_candidate_multiplier: 4
  pinn_resample_every: 500
  seed: 42
  softadapt_tau: 0.1
  softadapt_window: 5
  target_loss: 0.0
  target_loss_patience: 1
