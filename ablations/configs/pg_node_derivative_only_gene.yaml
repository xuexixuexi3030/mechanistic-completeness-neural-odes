    physics_factor_overrides:
      k_off: 0.22
    start: 21000
  - network_factor: 0.22
    physics_factor: 0.05
    physics_factor_overrides:
      k_off: 0.09
    start: 26000
  - network_factor: 0.12
    physics_factor: 0.025
    physics_factor_overrides:
      k_off: 0.035
    start: 30000
  - network_factor: 0.05
    physics_factor: 0.01
    physics_factor_overrides:
      k_off: 0.015
    start: 35000
