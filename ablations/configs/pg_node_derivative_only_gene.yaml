device: cuda
experiment_name: pg_node_derivative_only_gene
model:
  activation: tanh
  correction_scale: 0.1
  hidden_layers: 4
  hidden_units: 50
  init_method: glorot_normal
  mode: mode_b
  mode_a_constrain_unknown: false
  mode_a_normalize_inputs: false
  mode_a_state_scales: []
  mode_a_use_correction: true
  mode_b_neighborhood_samples: 0
  mode_b_neighborhood_scale: 0.0
  mode_b_normalize_inputs: true
  mode_b_output_scales:
  - 10.0
  - 10.0
  - 10.0
  mode_b_state_scales:
  - 20.0
  - 30.0
  - 20.0
  mode_c_bound_correction: true
  mode_c_use_correction: true
  mode_c_use_physics: true
  node_hidden_layers: 3
  node_hidden_units: 64
  node_normalize_inputs: false
  node_output_scales: []
  node_state_scales: []
  ode_atol: 1.0e-06
  ode_rtol: 0.0001
  ode_solver: rk4
  ode_step_size: 1.0
  pinn_output_transform: ''
  pinn_state_scales: []
  positive_output: true
  use_adjoint: false
output_dir: results
system:
