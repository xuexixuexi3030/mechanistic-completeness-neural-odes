  data_source: synthetic
  initial_conditions: []
  name: gene_regulatory
  noise_std: 0.0
  num_test_points: 100
  num_train_points: 10
  param_init: {}
  split_strategy: uniform
  state_columns: []
  t_span:
  - 0.0
  - 100.0
  time_column: time
  true_params: {}
training:
  adam_amsgrad: false
  adam_beta1: 0.9
  adam_beta2: 0.9998
  adam_decay_start: 7000
  adam_epochs: 42000
  adam_eps: 1.0e-08
  adam_final_lr: 1.0e-06
  adam_lr: 7.5e-05
  alternating_network_steps: 0
  alternating_physics_steps: 0
  alternating_update_start: 0
  balancing_strategy: fixed
  checkpoint_every: 2500
  component_loss: true
  data_component_max_weight: 0.05
  data_component_weights:
