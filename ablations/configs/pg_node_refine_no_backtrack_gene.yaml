device: cuda
experiment_name: pg_node_refine_no_backtrack_gene
model:
  activation: tanh
  correction_scale: 0.1
  hidden_layers: 4
  hidden_units: 50
  init_method: glorot_normal
  mode: mode_b
  mode_a_constrain_unknown: false
  mode_a_normalize_inputs: false
  mode_a_state_scales: []
  mode_a_use_correction: true
  mode_b_neighborhood_samples: 0
  mode_b_neighborhood_scale: 0.0
  mode_b_normalize_inputs: true
  mode_b_output_scales:
  - 10.0
  - 10.0
  - 10.0
  mode_b_state_scales:
  - 20.0
  - 30.0
  - 20.0
  mode_c_bound_correction: true
  mode_c_use_correction: true
  mode_c_use_physics: true
  node_hidden_layers: 3
  node_hidden_units: 64
  node_normalize_inputs: false
  node_output_scales: []
  node_state_scales: []
  ode_atol: 1.0e-06
  ode_rtol: 0.0001
  ode_solver: rk4
  ode_step_size: 1.0
  pinn_output_transform: ''
  pinn_state_scales: []
  positive_output: true
  use_adjoint: false
output_dir: results
system:
  data_path: ''
  data_source: synthetic
  initial_conditions: []
  name: gene_regulatory
  noise_std: 0.0
  num_test_points: 100
  num_train_points: 10
  param_init: {}
  split_strategy: uniform
  state_columns: []
  t_span:
  - 0.0
  - 100.0
  time_column: time
  true_params: {}
training:
  adam_amsgrad: true
  adam_beta1: 0.9
  adam_beta2: 0.9998
  adam_decay_start: 0
  adam_epochs: 5000
  adam_eps: 1.0e-08
  adam_final_lr: 0.0
  adam_lr: 1.5e-06
  alternating_network_steps: 0
  alternating_physics_steps: 0
  alternating_update_start: 0
  balancing_strategy: fixed
  checkpoint_every: 500
  component_loss: true
  data_component_max_weight: 0.05
  data_component_weights:
  - 1.2
  - 1.28
  - 0.52
  data_normalization_floor: 1.0
  early_stopping_min_relative_improvement: 0.0001
  early_stopping_patience: 2500
  early_stopping_start_epoch: 2500
  ema_decay: 0.9985
  ema_max_loss_ratio: 1.0
  ema_start_epoch: 18000
  ema_use_for_final: false
  gradient_clip_norm: 0.15
  gradnorm_alpha: 1.5
  init_checkpoint: checkpoints/pg_node_gene_initial.pt
  lambda_correction: 0.0
  lambda_data: 1.0
  lambda_gamma: 0.0
  lambda_ic: 10.0
  lambda_physics: 0.018
  lambda_physics_data: 0.0002
  lambda_reg: 0.0
  lbfgs_epochs: 1500
  lbfgs_lr: 0.006
  lbfgs_max_iter: 5
  log_every: 25
  loss_backtrack_end_epoch: 0
  loss_backtrack_factor: 0.5
  loss_backtrack_max_steps: 0
  loss_backtrack_rejection_lr_factor: 0.2
  loss_backtrack_start_epoch: 0
  loss_backtrack_trigger_ratio: 1.02
  loss_type: normalized_mse
  lr_stage_transition_epochs: 350
  lr_stages:
  - network_factor: 0.5
    physics_factor: 0.45
    physics_factor_overrides:
      k_off: 0.55
    start: 1600
  - network_factor: 0.18
    physics_factor: 0.14
    physics_factor_overrides:
      k_off: 0.2
    start: 3200
  - network_factor: 0.05
    physics_factor: 0.04
    physics_factor_overrides:
      k_off: 0.06
    start: 4300
  max_network_update_norm: 0.0001
  max_physics_update_norm: 1.5e-05
  normalize_physics_loss: true
  num_collocation: 200
  ode_window_epochs: 0
  ode_window_points: 0
  ode_window_strategy: rotating
  ode_windows_per_epoch: 1
  parameter_refine_network_lr_factor: 1.0
  parameter_refine_physics_lr_factor: 1.0
  parameter_refine_start: 0
  phys_lr: 3.0e-06
  phys_lr_overrides:
    k_off: 4.0e-06
  physics_data_derivative_method: midpoint
  physics_ramp_epochs: 0
  physics_ramp_power: 1.0
  physics_ramp_schedule: linear
  physics_warmup_epochs: 0
  pinn_adaptive_collocation: false
  pinn_adaptive_fraction: 0.0
  pinn_candidate_multiplier: 4
  pinn_resample_every: 500
  seed: 42
  softadapt_tau: 0.1
  softadapt_window: 5
  target_loss: 1.0e-06
  target_loss_patience: 100
